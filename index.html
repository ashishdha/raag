<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raag Database · Hindustaanee Sangeet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="index-chatgpt.css">
</head>
<body>

<header>
  <p class="eyebrow">Hindustaanee Raag Database</p>
  <div class="header-row">
    <div class="counter">
      <span class="counter-number" id="counter">···</span>
      <span class="counter-label">raags</span>
    </div>

    <div class="controls">
      <div class="field">
        <label for="present-input">Present svar</label>
        <div class="field-wrap present">
          <input id="present-input" type="text" placeholder="e.g. G r" autocomplete="off" spellcheck="false">
        </div>
        <div class="chips" id="present-chips"></div>
      </div>

      <div class="field">
        <label for="varjit-input">Varjit svar</label>
        <div class="field-wrap varjit">
          <input id="varjit-input" type="text" placeholder="e.g. N d" autocomplete="off" spellcheck="false">
        </div>
        <div class="chips" id="varjit-chips"></div>
      </div>

      <button class="reset" id="reset-btn" type="button">Reset</button>
    </div>
  </div>
</header>

<main>
  <div class="table-shell">
    <table>
      <thead>
        <tr>
          <th class="col-id">ID</th>
          <th class="col-name">Name</th>
          <th class="col-aaroh">Aaroh</th>
          <th class="col-avaroh">Avaroh</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="4" class="status" id="status-row">Loading raags…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<footer>Case-sensitive sargam: S r R g G M m P d D n N · uppercase = shuddha/teevra, lowercase = komal</footer>

<script>
(function(){

  const SUPABASE_URL = 'https://cxjfqwnmabyabhjhadjy.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4amZxd25tYWJ5YWJoamhhZGp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU5Njc2NDUsImV4cCI6MjA3MTU0MzY0NX0.qbI-CU_wgAioBihGx54RXpr4cBryhzIjc4C8iT5YAX0';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const tableBody     = document.getElementById('table-body');
  const counterEl      = document.getElementById('counter');
  const presentInput   = document.getElementById('present-input');
  const varjitInput     = document.getElementById('varjit-input');
  const presentChipsEl = document.getElementById('present-chips');
  const varjitChipsEl   = document.getElementById('varjit-chips');
  const resetBtn       = document.getElementById('reset-btn');

  let pcSargam   = new Map();   // id (0-11)  -> sargam letter, for display
  let pcReverse  = new Map();   // sargam letter -> id (0-11), for filter parsing
  let rows       = [];          // { el, presentMask, varjitMask }

  // normalize any int (including octave-shifted / negative) down to pitch class 0-11
  /*function pitchClass(v){
    return ((v % 12) + 12) % 12;
  }*/

  async function fetchAll(table, columns, order){
    const pageSize = 1000;
    let all = [];
    let from = 0;
    while (true){
      const { data, error } = await supabase
        .from(table)
        .select(columns)
        .order(order, { ascending: true })
        .range(from, from + pageSize - 1);
      if (error) throw error;
      all = all.concat(data);
      if (!data.length || data.length < pageSize) break;
      from += pageSize;
    }
    return all;
  }

  function buildSargamMaps(pitchclasses){
    pitchclasses.forEach(pc => {
      if (pc.id >= 0 && pc.id <= 12){
        pcSargam.set(pc.id, pc.sargam);
        pcReverse.set(pc.sargam, pc.id);
      }
    });
  }

  function toSargamString(arr){
    if (!arr || !arr.length) return '—';
    //return arr.map(v => pcSargam.get(pitchClass(v)) ?? '?').join(' ');
    return arr.map(v => pcSargam.get(v) ?? '?').join(' ');
  }

  function toMasks(arr){
    let mask = 0;
    if (arr){
      //for (const v of arr){ mask |= (1 << pitchClass(v)); }
      for (const v of arr){ mask |= (1 << v); }
    }
    return mask;
  }

  function renderRows(data){
    const frag = document.createDocumentFragment();
    rows = new Array(data.length);

    data.forEach((raag, i) => {
      const presentMask = toMasks(raag.aaroh) | toMasks(raag.avaroh);
      const varjitMask = 0xFFF & ~presentMask; // 12-bit complement

      const tr = document.createElement('tr');

      const tdId = document.createElement('td');
      tdId.className = 'col-id';
      tdId.textContent = raag.id;

      const tdName = document.createElement('td');
      tdName.className = 'col-name';
      if (raag.name){
        tdName.textContent = raag.name;
      } else {
        tdName.textContent = 'Unnamed';
        tdName.classList.add('unnamed');
      }

      const tdAaroh = document.createElement('td');
      tdAaroh.className = 'col-aaroh';
      tdAaroh.textContent = toSargamString(raag.aaroh);

      const tdAvaroh = document.createElement('td');
      tdAvaroh.className = 'col-avaroh';
      tdAvaroh.textContent = toSargamString(raag.avaroh);

      tr.append(tdId, tdName, tdAaroh, tdAvaroh);
      frag.appendChild(tr);

      rows[i] = { el: tr, presentMask, varjitMask };
    });

    tableBody.innerHTML = '';
    tableBody.appendChild(frag);
  }

  // ── filter parsing ──────────────────────────────────────────

  function parseInputToMask(value){
    let mask = 0;
    const chips = [];
    for (const ch of value){
      const id = pcReverse.get(ch);
      if (id === undefined) continue;
      mask |= (1 << id);
      chips.push({ ch, komal: ch === ch.toLowerCase() });
    }
    return { mask, chips };
  }

  function renderChips(container, chips){
    container.innerHTML = '';
    chips.forEach(c => {
      const span = document.createElement('span');
      span.className = 'chip ' + (c.komal ? 'komal' : 'shuddha');
      span.textContent = c.ch;
      container.appendChild(span);
    });
  }

  let emptyRow = null;
  function ensureEmptyRow(){
    if (!emptyRow){
      emptyRow = document.createElement('tr');
      emptyRow.className = 'empty-row';
      const td = document.createElement('td');
      td.colSpan = 4;
      td.textContent = 'No raags match these filters.';
      emptyRow.appendChild(td);
    }
    return emptyRow;
  }

  function applyFilters(){
    const { mask: presentMask } = parseInputToMask(presentInput.value);
    const { mask: varjitReq }   = parseInputToMask(varjitInput.value);

    let visible = 0;
    for (let i = 0; i < rows.length; i++){
      const r = rows[i];
      const matchesPresent = (r.presentMask & presentMask) === presentMask;
      const matchesVarjit  = (r.varjitMask & varjitReq) === varjitReq;
      const show = matchesPresent && matchesVarjit;
      r.el.hidden = !show;
      if (show) visible++;
    }

    if (visible === 0 && rows.length > 0){
      tableBody.appendChild(ensureEmptyRow());
    } else if (emptyRow && emptyRow.parentNode){
      emptyRow.parentNode.removeChild(emptyRow);
    }

    updateCounter(visible);
  }

  let pulseTimer = null;
  function updateCounter(n){
    counterEl.textContent = n.toLocaleString();
    counterEl.classList.remove('pulse');
    void counterEl.offsetWidth; // restart animation
    counterEl.classList.add('pulse');
    clearTimeout(pulseTimer);
    pulseTimer = setTimeout(() => counterEl.classList.remove('pulse'), 220);
  }

  presentInput.addEventListener('input', () => {
    const { chips } = parseInputToMask(presentInput.value);
    renderChips(presentChipsEl, chips);
    applyFilters();
  });

  varjitInput.addEventListener('input', () => {
    const { chips } = parseInputToMask(varjitInput.value);
    renderChips(varjitChipsEl, chips);
    applyFilters();
  });

  resetBtn.addEventListener('click', () => {
    presentInput.value = '';
    varjitInput.value = '';
    renderChips(presentChipsEl, []);
    renderChips(varjitChipsEl, []);
    applyFilters();
    presentInput.focus();
  });

  async function init(){
    try{
      const [pitchclasses, raags] = await Promise.all([
        fetchAll('pitchclasses', 'id,sargam', 'id'),
        fetchAll('raags', 'id,name,aaroh,avaroh', 'id')
      ]);

      buildSargamMaps(pitchclasses);
      renderRows(raags);
      updateCounter(raags.length);
    } catch (err){
      tableBody.innerHTML = '';
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 4;
      td.className = 'status error';
      td.textContent = 'Could not load raags — ' + (err.message || err);
      tr.appendChild(td);
      tableBody.appendChild(tr);
      counterEl.textContent = '—';
    }
  }

  init();

})();
</script>

</body>
</html>
